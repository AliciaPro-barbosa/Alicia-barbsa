<div class="card h-100 shadow-sm">
    {% if p.imagem_url %}
    <img src="{{ p.imagem_url }}" class="card-img-top" alt="{{ p.nome }}" style="height:200px;object-fit:cover;">
    {% else %}
    <div class="bg-secondary-subtle d-flex align-items-center justify-content-center" style="height:200px;">Sem imagem</div>
    {% endif %}
    <div class="card-body d-flex flex-column">
        {% if p.categoria %}<span class="badge text-bg-light align-self-start mb-1">{{ p.categoria }}</span>{% endif %}
        <h5 class="card-title">{{ p.nome }}</h5>
        <p class="fs-5 fw-bold text-success mb-2">R$ {{ '%.2f'|format(p.preco)|replace('.', ',') }}</p>
        <a href="{{ url_for('loja.detalhe', produto_id=p.id) }}" class="btn btn-outline-primary mt-auto">Ver produto</a>
    </div>
</div>
