{% extends "base.html" %}

{% block title %}Produtos{% endblock %}
{% block content %}
<h1 class="mb-3">Produtos</h1>

<form method="get" class="row g-2 mb-4">
    <div class="col-md-6">
        <input type="text" name="q" value="{{ busca }}" class="form-control" placeholder="Buscar produto...">
    </div>
    <div class="col-md-4">
        <select name="categoria" class="form-select">
            <option value="">Todas as categorias</option>
            {% for c in categorias %}
            <option value="{{ c }}" {% if c == categoria %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2 d-grid">
        <button class="btn btn-dark">Filtrar</button>
    </div>
</form>

{% if produtos %}
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
    {% for p in produtos %}
    <div class="col">{% include "_card_produto.html" %}</div>
    {% endfor %}
</div>
{% else %}
<p class="text-muted">Nenhum produto encontrado.</p>
{% endif %}
{% endblock %}
