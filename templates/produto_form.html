{% extends "base.html" %}

{% block title %}{{ 'Editar' if produto else 'Novo' }} produto{% endblock %}
{% block content %}
<h1 class="mb-3">{{ 'Editar' if produto else 'Novo' }} produto</h1>
<form method="post" style="max-width:600px;">
    <div class="mb-3">
        <label class="form-label" for="nome">Nome</label>
        <input class="form-control" id="nome" name="nome" value="{{ produto.nome if produto else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label" for="descricao">Descrição</label>
        <textarea class="form-control" id="descricao" name="descricao" rows="3">{{ produto.descricao if produto and produto.descricao else '' }}</textarea>
    </div>
    <div class="row">
        <div class="col mb-3">
            <label class="form-label" for="preco">Preço (R$)</label>
            <input class="form-control" id="preco" name="preco" value="{{ produto.preco if produto else '' }}" required>
        </div>
        <div class="col mb-3">
            <label class="form-label" for="estoque">Estoque</label>
            <input type="number" min="0" class="form-control" id="estoque" name="estoque" value="{{ produto.estoque if produto else 0 }}" required>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="categoria">Categoria</label>
        <input class="form-control" id="categoria" name="categoria" value="{{ produto.categoria if produto and produto.categoria else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label" for="imagem_url">URL da imagem</label>
        <input class="form-control" id="imagem_url" name="imagem_url" value="{{ produto.imagem_url if produto and produto.imagem_url else '' }}">
    </div>
    <button class="btn btn-success">Salvar</button>
    <a href="{{ url_for('loja.admin_produtos') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
